<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz & Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Banner Header -->
  <header class="hero-header">
    <p class="subtitle">INTERACTIVE LEARNING DASHBOARD</p>
    <h1>Quiz & Weather Dashboard</h1>
    <p class="desc">Test your knowledge and explore real-time weather information.</p>
  </header>

  <div class="main-container">
    
    <!-- Left Column: Quiz Section -->
    <section class="card quiz-card">
      <div class="card-header">
        <span class="badge">KNOWLEDGE CHALLENGE</span>
      </div>
      
      <h2>Interactive Quiz</h2>

      <div class="quiz-info">
        <span class="step-tag" id="question-count">Question 1 of 5</span>
        <div class="timer">
          <span id="timer-count">30</span> seconds
        </div>
      </div>

      <h3 id="question-text" class="question-text">Loading question...</h3>

      <div class="options-grid" id="options-container">
        <!-- Options generated dynamically by JS -->
      </div>
    </section>

    <!-- Right Column: Leaderboard Section -->
    <section class="card leaderboard-card">
      <div class="card-header">
        <span class="badge">TOP SCORES</span>
      </div>
      
      <h2>Leaderboard</h2>
      <p class="section-desc">Your best quiz performances</p>

      <div id="leaderboard-list" class="leaderboard-list">
        <!-- Scores loaded dynamically from localStorage -->
      </div>
    </section>

  </div>

  <!-- Bottom Section: Weather Dashboard -->
  <div class="main-container">
    <section class="card weather-card">
      <div class="card-header">
        <span class="badge">LIVE WEATHER</span>
      </div>
      <h2>Weather Search</h2>
      <div class="search-box">
        <input type="text" id="city-input" placeholder="Enter city name (e.g., Gwalior)">
        <button id="search-btn">Search Weather</button>
      </div>
      <div id="weather-result" class="weather-result">
        <!-- Weather details loaded dynamically via REST API -->
      </div>
    </section>
  </div>

  <script src="index.js"></script>
</body>
</html>
